name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc14,   os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14, sweep: true }
          - { name: linux-x64-clang19, os: ubuntu-24.04,     cc: clang-19, cxx: clang++-19 }
          - { name: linux-arm64-gcc14, os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14 }
          # macOS: the runtime is built for 10.15 (CMakeLists.txt's default), the tools for 13.3, on Apple Silicon and Intel.
          - { name: macos-arm64,       os: macos-latest }
          - { name: macos-x64,         os: macos-15-intel }
          - { name: windows-x64,       os: windows-2022 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Timing test image dependency
        run: python -m pip install Pillow
      # GCC 14's libstdc++ provides <print>; Clang on Linux uses it too.
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ${{ startsWith(matrix.cc, 'clang') && matrix.cc || '' }} ${{ matrix.sweep && 'binutils-powerpc-linux-gnu' || '' }}
          # What SDL3 (fetched by CMake) builds against on Linux: without X11 or Wayland it refuses to configure.
          sudo apt-get install -y -qq libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          sudo apt-get install -y -qq xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ -n "${{ matrix.cxx }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQILIN_WERROR=ON "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Require a software Vulkan device and a desktop for graphical tests.
            xvfb-run -a env QILIN_REQUIRE_GRAPHICS=1 ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi
      # The decoder against GNU objdump over a sweep of the encoding space (no game files needed).
      - name: Decoder sweep
        if: matrix.sweep
        run: python3 tools/check/verify_decoder.py --qilin build/qilin --sweep
      # The analysis scripts need the game to run; check they at least compile.
      - name: Analysis scripts compile
        if: matrix.sweep
        run: python3 -m py_compile tools/analysis/*.py tools/check/*.py tools/build_shaders.py tools/tests/*.py
      # The game's shaders are committed as SPIR-V; check that it matches the sources and that they compile.
      - name: Shaders up to date
        if: matrix.sweep
        run: |
          sudo apt-get install -y glslang-tools
          python3 tools/build_shaders.py --check

  # Every test with AddressSanitizer (and LeakSanitizer) and UndefinedBehaviorSanitizer: GCC 14,
  # the first report fails the run. Graphical tests draw with Mesa's lavapipe under Xvfb, as the
  # build job's do; what the graphics stack and SDL keep until exit is suppressed (tools/check/lsan.supp).
  sanitize:
    name: linux-x64-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev xvfb xauth libvulkan1 mesa-vulkan-drivers llvm-18
      - name: Configure
        run: |
          # The tests that draw preload lavapipe (after the ASan runtime, which must come first): the Vulkan
          # loader unloads the driver at vkDestroyInstance, and what it keeps would reach the leak check from
          # unmapped code, with no module to name or suppress (tools/check/lsan.supp).
          lvp=/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          test -f "$lvp"
          # (Warnings are the build job's: GCC's flow warnings under the sanitizers' instrumentation aren't ours.)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQILIN_SANITIZE=address,undefined \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            "-DQILIN_GRAPHICS_TEST_ENV=LD_PRELOAD=$(gcc-14 -print-file-name=libasan.so):$lvp"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          # Whole stacks through code built without frame pointers (the driver's), symbolised by LLVM's.
          ASAN_OPTIONS: detect_leaks=1:fast_unwind_on_malloc=0:malloc_context_size=40
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/check/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: xvfb-run -a env QILIN_REQUIRE_GRAPHICS=1 ctest --test-dir build --output-on-failure --timeout 600

  # The tests of the threads' handoffs and the guest's clock with ThreadSanitizer (Clang 19). Newer
  # kernels randomise mmap over more bits than TSan's memory layout allows: lowered for the run.
  tsan:
    name: linux-x64-tsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 clang-19
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQILIN_SANITIZE=thread -DQILIN_HOST=OFF \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        run: cmake --build build --parallel --target mkdd_threads_test mkdd_guest_clock_test
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build -R 'mkdd_threads_test|mkdd_guest_clock_test' --output-on-failure --timeout 300
